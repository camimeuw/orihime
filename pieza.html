<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pieza — orihime</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body>

  <p class="anuncio-barra">envío gratis a sucursal superando los $80.000</p>

  <div id="carrito-overlay" class="carrito-overlay" hidden></div>
  <aside id="carrito-panel" class="carrito-panel" hidden>
    <div class="carrito-panel-header">
      <p class="carrito-panel-titulo">tu carrito</p>
      <button id="carrito-cerrar" class="carrito-cerrar" aria-label="cerrar carrito">cerrar ×</button>
    </div>
    <div id="carrito-items" class="carrito-items"></div>
    <p id="carrito-total" class="carrito-total"></p>
    <a id="carrito-whatsapp" class="btn-whatsapp" target="_blank" rel="noopener" hidden>finalizar por whatsapp</a>
  </aside>

  <header class="topbar">
    <div class="topbar-top">
      <div class="marca">
        <p class="mark">°</p>
        <div class="brand-row">
          <a href="index.html" class="wordmark">orihime</a>
          <p class="stamp-sub">archivo de piezas únicas</p>
        </div>
      </div>
      <button id="carrito-boton" class="carrito-boton" aria-label="ver carrito">
        carrito <span id="carrito-contador" class="carrito-contador" hidden>0</span>
      </button>
    </div>
    <nav class="nav-archivo">
      <a href="index.html#catalogo">catálogo</a>
      <a href="index.html#sobre">archivo</a>
      <a href="index.html#contacto">contacto</a>
    </nav>
  </header>

  <section class="detalle-pieza">
    <a href="index.html#catalogo" class="volver-link">&larr; volver al catálogo</a>
    <p id="detalle-estado" class="catalogo-estado">cargando pieza…</p>
    <div id="detalle-contenido" class="detalle-contenido"></div>
  </section>

  <footer id="contacto" class="footer-archivo">
    <p>pedidos por whatsapp</p>
    <a href="https://wa.me/5492314552379" id="btn-whatsapp-footer" class="btn-whatsapp" target="_blank" rel="noopener">escribinos</a>
  </footer>

  <script src="js/catalogo.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/detalle.js"></script>
</body>
</html>
